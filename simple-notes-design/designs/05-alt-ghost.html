<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Simple Notes — Ghost</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;display:flex;justify-content:center;padding:40px 0}
a{color:#d6d6d6}a:hover{color:#ffffff}
@keyframes gh-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.gh-cursor{animation:gh-blink 1s steps(1) infinite}
.gh-btn:hover{color:#ffffff}
</style>
</head>
<body>
<div style="width: 780px; height: 480px; box-sizing: border-box; padding: 56px 60px; background: #050505; font-family: 'DM Mono', ui-monospace, monospace; display: flex; gap: 60px; align-items: flex-start">

  <div style="display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 11px; color: #8a8a8a; letter-spacing: 0.1em">IDLE — NO CHROME</span>
    <div style="width: 300px; height: 300px; background: #111111; display: flex; flex-direction: column; color: #d6d6d6">
      <div style="height: 30px"></div>
      <div style="flex: 1; padding: 6px 18px; font-size: 13px; font-weight: 300; line-height: 1.8">
        <div>the app should feel like</div>
        <div>a thought, not a program.</div>
        <div style="margin-top: 14px; color: #8a8a8a">nothing on screen</div>
        <div style="color: #8a8a8a">until you ask for it.</div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 11px; color: #8a8a8a; letter-spacing: 0.1em">HOVER — CONTROLS FADE IN</span>
    <div style="width: 300px; height: 300px; background: #111111; outline: 1px solid #2a2a2a; display: flex; flex-direction: column; color: #d6d6d6">
      <div style="height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; font-size: 13px">
        <button class="gh-btn" aria-label="New note" style="height: 28px; padding: 0 8px; border: 0; background: transparent; color: #8a8a8a; font-family: inherit; font-size: 14px; cursor: pointer">+</button>
        <span style="font-size: 10px; color: #8a8a8a">thought.txt</span>
        <div style="display: flex">
          <button class="gh-btn" aria-label="Menu" style="height: 28px; padding: 0 6px; border: 0; background: transparent; color: #8a8a8a; font-family: inherit; font-size: 13px; cursor: pointer">···</button>
          <button class="gh-btn" aria-label="Close" style="height: 28px; padding: 0 8px; border: 0; background: transparent; color: #8a8a8a; font-family: inherit; font-size: 14px; cursor: pointer">×</button>
        </div>
      </div>
      <div style="flex: 1; padding: 6px 18px; font-size: 13px; font-weight: 300; line-height: 1.8">
        <div>the app should feel like</div>
        <div>a thought, not a program.</div>
        <div style="margin-top: 14px; color: #8a8a8a">nothing on screen</div>
        <div style="color: #8a8a8a">until you ask for it.<span class="gh-cursor" style="display: inline-block; width: 7px; height: 2px; background: #d6d6d6; margin-left: 2px"></span></div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
