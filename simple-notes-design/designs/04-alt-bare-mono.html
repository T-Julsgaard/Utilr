<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Simple Notes — Bare Mono</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;display:flex;justify-content:center;padding:40px 0}
a{color:#ffffff}a:hover{color:#bbbbbb}
@keyframes mo-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.mo-cursor{animation:mo-blink 1s steps(1) infinite}
.mo-btn:hover{opacity:1}
</style>
</head>
<body>
<div style="width: 780px; height: 480px; box-sizing: border-box; padding: 56px 60px; background: #1a1a1a; font-family: 'IBM Plex Mono', ui-monospace, monospace; display: flex; gap: 60px; align-items: flex-start">

  <div style="display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 11px; color: #9a9a9a; letter-spacing: 0.1em">DARK / EMPTY</span>
    <div style="width: 300px; height: 300px; background: #000000; outline: 1px solid #333333; display: flex; flex-direction: column; color: #f2f2f2">
      <div style="height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 2px">
        <button class="mo-btn" aria-label="New note" style="width: 30px; height: 28px; border: 0; background: transparent; color: #f2f2f2; opacity: 0.7; font-family: inherit; font-size: 15px; cursor: pointer">+</button>
        <div style="display: flex">
          <button class="mo-btn" aria-label="Menu" style="width: 30px; height: 28px; border: 0; background: transparent; color: #f2f2f2; opacity: 0.7; font-family: inherit; font-size: 13px; cursor: pointer">…</button>
          <button class="mo-btn" aria-label="Close" style="width: 30px; height: 28px; border: 0; background: transparent; color: #f2f2f2; opacity: 0.7; font-family: inherit; font-size: 14px; cursor: pointer">×</button>
        </div>
      </div>
      <div style="height: 1px; background: #f2f2f2; margin: 0 12px"></div>
      <div style="flex: 1; padding: 16px 14px; font-size: 13px">
        <span class="mo-cursor" style="display: inline-block; width: 1px; height: 16px; background: #f2f2f2; vertical-align: -3px"></span><span style="color: #8c8c8c"> _</span>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 11px; color: #9a9a9a; letter-spacing: 0.1em">LIGHT / WRITING</span>
    <div style="width: 300px; height: 300px; background: #f4f4f0; display: flex; flex-direction: column; color: #111111">
      <div style="height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 2px">
        <button class="mo-btn" aria-label="New note" style="width: 30px; height: 28px; border: 0; background: transparent; color: #111111; opacity: 0.7; font-family: inherit; font-size: 15px; cursor: pointer">+</button>
        <div style="display: flex">
          <button class="mo-btn" aria-label="Menu" style="width: 30px; height: 28px; border: 0; background: transparent; color: #111111; opacity: 0.7; font-family: inherit; font-size: 13px; cursor: pointer">…</button>
          <button class="mo-btn" aria-label="Close" style="width: 30px; height: 28px; border: 0; background: transparent; color: #111111; opacity: 0.7; font-family: inherit; font-size: 14px; cursor: pointer">×</button>
        </div>
      </div>
      <div style="height: 1px; background: #111111; margin: 0 12px"></div>
      <div style="flex: 1; padding: 16px 14px; font-size: 13px; line-height: 1.75">
        <div style="font-weight: 600">meeting w/ design — 11.08</div>
        <div>- keep it one window</div>
        <div>- no toolbar, ever</div>
        <div>- font = the whole brand</div>
        <div style="margin-top: 10px; color: #555555">follow-up: export as .txt<span class="mo-cursor" style="display: inline-block; width: 1px; height: 16px; background: #111111; vertical-align: -3px; margin-left: 1px"></span></div>
      </div>
      <div style="padding: 0 14px 10px; font-size: 10px; color: #6b6b6b; text-align: right">142 chars</div>
    </div>
  </div>

</div>
</body>
</html>
