<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'">
<title>paletr</title>
<link rel="stylesheet" href="theme/fonts.css">
<link rel="stylesheet" href="theme/ghost.css">
<link rel="stylesheet" href="paletr.css">
</head>
<body class="palette" data-theme="ghost">
  <header class="bar">
    <div class="bar-left"><span class="bar-title">paletr</span></div>
    <div class="bar-right">
      <button class="btn" id="btn-pick" title="pick a color (p)" aria-label="Pick a color">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
      </button>
      <button class="btn" id="btn-menu" title="settings" aria-label="Settings" aria-expanded="false">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="1.7" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="7" cy="7" r="4.1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 .9v2M7 11.1v2M.9 7h2M11.1 7h2M2.7 2.7l1.4 1.4M9.9 9.9l1.4 1.4M2.7 11.3l1.4-1.4M9.9 4.1l1.4-1.4" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
      </button>
      <button class="btn" id="btn-close" title="close (esc)" aria-label="Close">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
      </button>
    </div>
  </header>

  <main class="content" id="content">
    <div class="grid" id="grid" role="listbox" aria-label="colors"></div>
    <div class="empty" id="empty" hidden>
      <span>nothing picked yet</span>
      <span class="d"><span id="empty-key"></span> or + to pick</span>
    </div>
  </main>

  <footer class="status">
    <span class="st-left" id="st-left"></span>
    <span class="st-right" id="st-right"></span>
  </footer>

  <div class="menu" id="menu" role="menu" hidden></div>

  <div class="confirm" id="confirm" hidden>
    <span class="confirm-label" id="confirm-label">clear palette?</span>
    <span class="confirm-actions">
      <button class="cbtn danger" id="yes">[y]es</button>
      <button class="cbtn" id="no">[n]o</button>
    </span>
  </div>

  <div class="frame" aria-hidden="true"></div>

  <script src="theme/ghost.js"></script>
  <script src="keys.js"></script>
  <script src="color.js"></script>
  <script src="palette.js"></script>
</body>
</html>
