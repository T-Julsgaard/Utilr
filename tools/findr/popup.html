<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'">
<title>findr</title>
<link rel="stylesheet" href="theme/fonts.css">
<link rel="stylesheet" href="theme/ghost.css">
<link rel="stylesheet" href="findr.css">
</head>
<!-- One popup, three looks (body.l-window / l-bar / l-line, see findr.css):
     the same find line and results, laid out as a window, a floating bar or
     a line across the top of the screen. -->
<body class="popup l-window" data-theme="ghost">
  <div class="shell" id="shell">
    <header class="bar">
      <div class="bar-left">
        <span class="bar-title">findr</span>
      </div>
      <div class="bar-right">
        <button class="btn btn-menu" title="settings" aria-label="settings" aria-expanded="false">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="1.7" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="7" cy="7" r="4.1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 .9v2M7 11.1v2M.9 7h2M11.1 7h2M2.7 2.7l1.4 1.4M9.9 9.9l1.4 1.4M2.7 11.3l1.4-1.4M9.9 4.1l1.4-1.4" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
        </button>
        <button class="btn" id="btn-close" title="close" aria-label="close">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
        </button>
      </div>
    </header>

    <div class="ask">
      <span class="prompt" aria-hidden="true">›</span>
      <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h12v12H3zM5 5v8h8V5zM14 16l2-2 6 6-2 2z" fill="currentColor" fill-rule="evenodd"/></svg>
      <input class="find" id="find" type="text" spellcheck="false" autocomplete="off" aria-label="find a file">
      <span class="note" id="note"></span>
      <span class="hints" id="hints">enter open · ctrl+enter folder · ctrl+shift+c path · ctrl+, look</span>
      <span class="count" id="count"></span>
      <button class="btn btn-menu ask-menu" title="settings" aria-label="settings" aria-expanded="false">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="1.7" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="7" cy="7" r="4.1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 .9v2M7 11.1v2M.9 7h2M11.1 7h2M2.7 2.7l1.4 1.4M9.9 9.9l1.4 1.4M2.7 11.3l1.4-1.4M9.9 4.1l1.4-1.4" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
      </button>
    </div>

    <main class="content" id="list" role="listbox" aria-label="files"></main>

    <footer class="status">
      <span class="st-left" id="st-left"></span>
      <span class="st-right" id="st-right"></span>
    </footer>
  </div>

  <div class="menu" id="menu" role="menu" hidden></div>

  <div class="frame" aria-hidden="true"></div>

  <span class="ruler" id="ruler" aria-hidden="true">0000000000</span>

  <script src="theme/ghost.js"></script>
  <script src="keys.js"></script>
  <script src="popup.js"></script>
</body>
</html>
