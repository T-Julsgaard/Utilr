<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; script-src 'self'">
<title>snipr</title>
<link rel="stylesheet" href="theme/fonts.css">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="theme/ghost.css">
<link rel="stylesheet" href="snipr.css">
</head>
<body class="snip" data-theme="ghost" data-tool="none">
  <header class="bar">
    <div class="bar-left">
      <button class="btn sm" data-tool="pen" title="Pen (p)" aria-label="Pen">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 12l.8-3L9.6 2.2l2.2 2.2L5 11.2zM8.2 3.6l2.2 2.2" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="miter"/></svg>
      </button>
      <button class="btn sm" data-tool="arrow" title="Arrow (a)" aria-label="Arrow">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 12L11.6 2.4M5.6 2.2h6.2v6.2" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
      </button>
      <button class="btn sm" data-tool="box" title="Box (b)" aria-label="Box">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.7 3.2h10.6v7.6H1.7z" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
      </button>
      <button class="btn sm" data-tool="circle" title="Circle (c)" aria-label="Circle">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.4" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
      </button>
      <button class="btn sm" data-tool="text" title="Text (t) — drag a box: the text follows its height" aria-label="Text">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.2 2.6h9.6M7 2.6v9.4M5 12h4" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
      </button>
      <button class="btn sm" data-tool="blur" title="Blur (x)" aria-label="Blur">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.7 1.7h10.6v10.6H1.7zM5.2 1.7v10.6M8.8 1.7v10.6M1.7 5.2h10.6M1.7 8.8h10.6" stroke="currentColor" stroke-width="1.1" fill="none"/></svg>
      </button>
    </div>
    <div class="bar-right">
      <button class="btn sm" id="btn-copy" title="Copy (ctrl+c)" aria-label="Copy">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M4.6 4.6h7.7v7.7H4.6zM9.4 4.6V1.7H1.7v7.7h2.9" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
      </button>
      <button class="btn sm" id="btn-text" title="Copy text (ctrl+shift+c)" aria-label="Copy text" hidden>
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.7 3h10.6M1.7 6h10.6M1.7 9h7.2M1.7 12h4.6" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
      </button>
      <button class="btn sm" id="btn-save" title="Save (ctrl+s)" aria-label="Save">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.4v8M3.8 6.2L7 9.4l3.2-3.2M1.7 9.6v2.7h10.6V9.6" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
      </button>
      <div class="bar-gap"></div>
      <button class="btn" id="btn-settings" title="Settings" aria-label="Settings" aria-haspopup="menu" aria-expanded="false">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
          <circle cx="7" cy="7" r="1.7" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <circle cx="7" cy="7" r="4.1" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <path d="M7 .9v2M7 11.1v2M.9 7h2M11.1 7h2M2.7 2.7l1.4 1.4M9.9 9.9l1.4 1.4M2.7 11.3l1.4-1.4M9.9 4.1l1.4-1.4" stroke="currentColor" stroke-width="1.3" fill="none"/>
        </svg>
      </button>
      <button class="btn" id="btn-close" title="Close (esc)" aria-label="Close">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="canvas" draggable="true"></canvas>
  </main>

  <footer class="status">
    <span class="st-left" id="st-left"></span>
    <span class="st-right" id="st-right"></span>
  </footer>

  <div class="confirm" id="confirm" hidden>
    <span class="confirm-label">discard marks?</span>
    <span class="confirm-actions">
      <button class="cbtn danger" id="confirm-yes">[y]es</button>
      <button class="cbtn" id="confirm-no">[n]o</button>
      <button class="cbtn" id="confirm-dont" title="Discard, and don't ask again (turn it back on in settings)">[d]ont ask again</button>
    </span>
  </div>

  <div class="menu" id="menu" role="menu" hidden></div>
  <div class="menu" id="ctx" role="menu" hidden></div>
  <div class="frame" aria-hidden="true"></div>

  <script src="theme/ghost.js"></script>
  <script src="keys.js"></script>
  <script src="fonts/list.js"></script>
  <script src="menu.js"></script>
  <script src="snip.js"></script>
</body>
</html>
