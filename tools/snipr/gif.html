<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; script-src 'self'">
<title>snipr</title>
<link rel="stylesheet" href="theme/fonts.css">
<link rel="stylesheet" href="theme/ghost.css">
<link rel="stylesheet" href="snipr.css">
</head>
<body class="snip gifwin" data-theme="ghost">
  <header class="bar">
    <div class="bar-left"><span class="bar-title">gif</span></div>
    <div class="bar-right">
      <button class="btn sm" id="btn-save" title="Save as… (ctrl+s)" aria-label="Save as">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.4v8M3.8 6.2L7 9.4l3.2-3.2M1.7 9.6v2.7h10.6V9.6" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
      </button>
      <button class="btn sm" id="btn-folder" title="Show in folder" aria-label="Show in folder">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.7 2.6h4l1.3 1.6h5.3v7.2H1.7z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="miter"/></svg>
      </button>
      <button class="btn sm" id="btn-delete" title="Delete (del): to the recycle bin" aria-label="Delete">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.7 3.4h10.6M5.2 3.4V1.8h3.6v1.6M3.1 3.4l.7 8.8h6.4l.7-8.8" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
      </button>
      <div class="bar-gap"></div>
      <button class="btn" id="btn-close" title="Close (esc)" aria-label="Close">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <img id="gif" alt="" draggable="true">
  </main>

  <footer class="status">
    <span class="st-left" id="st-left"></span>
    <span class="st-right" id="st-right"></span>
  </footer>

  <div class="frame" aria-hidden="true"></div>

  <script src="theme/ghost.js"></script>
  <script src="gif.js"></script>
</body>
</html>
